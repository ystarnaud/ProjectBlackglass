# Blackglass accounts stack (bg-dev-services01). Loopback only, spec §4.5: the API is published on 127.0.0.1:5080;
# PostgreSQL has no ports and sits on an internal network. Deploy with deploy.sh (stop api -> backup -> migrate -> start).
# Static tests read this file line by line: two-space indentation, ports in the short quoted form only.
name: blackglass-accounts

services:
  postgres:
    image: postgres:17
    command: ["postgres", "-c", "cluster_name=blackglass-accounts"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - pg_superuser_password
      - pg_init_migrator_password
      - pg_init_app_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      # TCP, not the socket: during first-start init the image runs a temporary server on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d accounts"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: local

  migrate:
    image: blackglass-accounts-api:${BLACKGLASS_API_TAG:-dev}
    profiles:
      - tools
    command: ["migrate"]
    environment:
      BLACKGLASS_DB_HOST: postgres
      BLACKGLASS_DB_NAME: accounts
      BLACKGLASS_DB_USER: accounts_migrator
      BLACKGLASS_DB_PASSWORD_FILE: /run/secrets/migrate_db_password
    secrets:
      - migrate_db_password
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: blackglass-accounts-api:${BLACKGLASS_API_TAG:-dev}
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["serve"]
    environment:
      BLACKGLASS_DB_HOST: postgres
      BLACKGLASS_DB_NAME: accounts
      BLACKGLASS_DB_USER: accounts_app
      BLACKGLASS_DB_PASSWORD_FILE: /run/secrets/api_db_password
      # Stage 3: development login and the /dev/v1 admin routes are off unless set to exactly "enabled" (spec §4.2).
      BLACKGLASS_DEV_AUTH: ${BLACKGLASS_DEV_AUTH:-disabled}
      BLACKGLASS_ADMIN_ROUTES: ${BLACKGLASS_ADMIN_ROUTES:-disabled}
      BLACKGLASS_ADMIN_KEY_FILE: /run/secrets/api_admin_key
      # Provisional limits (spec §19); empty means the built-in default.
      BLACKGLASS_TOKEN_LIFETIME_MINUTES: ${BLACKGLASS_TOKEN_LIFETIME_MINUTES:-}
      BLACKGLASS_RATE_LOGIN_PER_MINUTE: ${BLACKGLASS_RATE_LOGIN_PER_MINUTE:-}
      BLACKGLASS_RATE_LOGIN_GLOBAL_PER_MINUTE: ${BLACKGLASS_RATE_LOGIN_GLOBAL_PER_MINUTE:-}
      BLACKGLASS_RATE_REQUESTS_PER_MINUTE: ${BLACKGLASS_RATE_REQUESTS_PER_MINUTE:-}
      BLACKGLASS_RATE_ADMIN_PER_MINUTE: ${BLACKGLASS_RATE_ADMIN_PER_MINUTE:-}
      BLACKGLASS_INVENTORY_MAX_OPERATIONS: ${BLACKGLASS_INVENTORY_MAX_OPERATIONS:-}
      BLACKGLASS_INVENTORY_MAX_BODY_BYTES: ${BLACKGLASS_INVENTORY_MAX_BODY_BYTES:-}
      # Stage 6 energy (provisional, spec §19): the reconciliation sweep interval (0 = off) and the largest dev grant.
      BLACKGLASS_ENERGY_RECONCILE_SECONDS: ${BLACKGLASS_ENERGY_RECONCILE_SECONDS:-}
      BLACKGLASS_ENERGY_GRANT_MAX: ${BLACKGLASS_ENERGY_GRANT_MAX:-}
      BLACKGLASS_DB_LOCK_TIMEOUT_MS: ${BLACKGLASS_DB_LOCK_TIMEOUT_MS:-}
      BLACKGLASS_DB_STATEMENT_TIMEOUT_MS: ${BLACKGLASS_DB_STATEMENT_TIMEOUT_MS:-}
    secrets:
      - api_db_password
      - api_admin_key
    ports:
      - "127.0.0.1:5080:8080"
    networks:
      - db
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local

  # The operator CLI (spec §4.2): `docker compose -p blackglass-accounts -f compose.yaml --profile tools run --rm admin
  # account create [--handle <h>] [--display-name <name>] --operator <name> --reason <text>`. Runs as accounts_app on the
  # internal network only; publishes nothing.
  admin:
    image: blackglass-accounts-api:${BLACKGLASS_API_TAG:-dev}
    profiles:
      - tools
    entrypoint: ["dotnet", "Accounts.Api.dll", "admin"]
    environment:
      BLACKGLASS_DB_HOST: postgres
      BLACKGLASS_DB_NAME: accounts
      BLACKGLASS_DB_USER: accounts_app
      BLACKGLASS_DB_PASSWORD_FILE: /run/secrets/admin_db_password
      BLACKGLASS_ENERGY_RECONCILE_SECONDS: ${BLACKGLASS_ENERGY_RECONCILE_SECONDS:-}
      BLACKGLASS_ENERGY_GRANT_MAX: ${BLACKGLASS_ENERGY_GRANT_MAX:-}
      BLACKGLASS_DB_LOCK_TIMEOUT_MS: ${BLACKGLASS_DB_LOCK_TIMEOUT_MS:-}
      BLACKGLASS_DB_STATEMENT_TIMEOUT_MS: ${BLACKGLASS_DB_STATEMENT_TIMEOUT_MS:-}
    secrets:
      - admin_db_password
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Its stdout carries a new account key once, for the operator's terminal only: no log driver keeps it.
    logging:
      driver: none

networks:
  db:
    internal: true
  edge:
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  pgdata:

# One 0400 file per consumer, owned by that container's user (ruling 5); see make-secrets.sh.
secrets:
  pg_superuser_password:
    file: ${BLACKGLASS_SECRETS_DIR:-/opt/blackglass/accounts/secrets}/postgres/superuser_password
  pg_init_migrator_password:
    file: ${BLACKGLASS_SECRETS_DIR:-/opt/blackglass/accounts/secrets}/postgres/migrator_password
  pg_init_app_password:
    file: ${BLACKGLASS_SECRETS_DIR:-/opt/blackglass/accounts/secrets}/postgres/app_password
  migrate_db_password:
    file: ${BLACKGLASS_SECRETS_DIR:-/opt/blackglass/accounts/secrets}/migrate/db_password
  api_db_password:
    file: ${BLACKGLASS_SECRETS_DIR:-/opt/blackglass/accounts/secrets}/api/db_password
  api_admin_key:
    file: ${BLACKGLASS_SECRETS_DIR:-/opt/blackglass/accounts/secrets}/api/admin_key
  admin_db_password:
    file: ${BLACKGLASS_SECRETS_DIR:-/opt/blackglass/accounts/secrets}/admin/db_password
