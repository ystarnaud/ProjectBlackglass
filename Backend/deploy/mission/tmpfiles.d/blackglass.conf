# /etc/tmpfiles.d/blackglass.conf (root:root 0644): the directories and their owners (spec §9.2, A10-D1). No age: nothing here
# is ever cleaned automatically (outbox and relay cleanup is Phase 14's).
d /var/lib/blackglass               0755 root              root              -
# The agent's outboxDir: only a mount point for its unit's read-only bind of the mission outboxes (empty on the host).
d /var/lib/blackglass/outbox        0755 root              root              -
d /var/lib/blackglass/exits         0750 root              blackglass-agent  -
d /var/lib/blackglass/agent         0700 blackglass-agent  blackglass-agent  -
d /var/lib/blackglass/relay         0700 blackglass-agent  blackglass-agent  -
d /var/lib/blackglass/tunnel        0700 blackglass-tunnel blackglass-tunnel -
# The mission outboxes: systemd's private state directories (StateDirectory=blackglass-outbox/<attempt> of the slot templates,
# security correction C1). /var/lib/private stays root 0700: only root, and the agent's unit through its bind, ever reach them.
d /var/lib/private                  0700 root              root              -
d /var/lib/private/blackglass-outbox 0755 root             root              -
d /var/log/blackglass               0755 root              root              -
d /run/blackglass                   0755 root              root              -
# The root credential broker's store (security correction I3): LoadCredential's only source; root's own, never the agent's.
d /run/blackglass/credentials       0700 root              root              -
