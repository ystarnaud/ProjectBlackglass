# /etc/sysusers.d/blackglass.conf (root:root 0644): the static service identities, both without a login shell or a password.
# blackglass-agent is the agent; blackglass-tunnel runs the SSH tunnel to the services VM (A10-D3). Neither is in the other's group.
# Mission units have no static user: each slot's units run as that slot's systemd dynamic user, blackglass-mNN (security
# correction C1). No static blackglass-mNN may exist (systemd would use it instead, shared by every unit of that slot over time).
g blackglass-agent   -
u blackglass-agent   -:blackglass-agent   "Blackglass mission host agent" /var/lib/blackglass/agent  /usr/sbin/nologin
g blackglass-tunnel  -
u blackglass-tunnel  -:blackglass-tunnel  "Blackglass API tunnel"         /var/lib/blackglass/tunnel /usr/sbin/nologin
