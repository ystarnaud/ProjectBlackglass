# /etc/sysusers.d/blackglass.conf (root:root 0644): the service identities, all without a login shell or a password.
# blackglass-agent is the agent; blackglass-mission runs every mission unit (isolated per attempt by mount namespaces);
# blackglass-tunnel runs the SSH tunnel to the services VM (A10-D3). None is in another's group.
g blackglass-agent   -
u blackglass-agent   -:blackglass-agent   "Blackglass mission host agent" /var/lib/blackglass/agent  /usr/sbin/nologin
g blackglass-mission -
u blackglass-mission -:blackglass-mission "Blackglass mission processes"  /nonexistent              /usr/sbin/nologin
g blackglass-tunnel  -
u blackglass-tunnel  -:blackglass-tunnel  "Blackglass API tunnel"         /var/lib/blackglass/tunnel /usr/sbin/nologin
