# /etc/ssh/sshd_config.d/60-bg-api-tunnel.conf (root:root 0644) on the services VM (bg-dev-services01). A10-D3.
# The dedicated account bg-api-tunnel (no password, shell /usr/sbin/nologin, separate from every administrator) may open one
# local forward to 127.0.0.1:5080 and nothing else: no shell, no command, no TTY, no agent, X11 or stream-local forwarding,
# no remote forward, no tunnel device. Its authorized_keys (root-owned, see services-vm-authorized_keys) repeats the restriction.
# If sshd_config limits logins with AllowUsers or AllowGroups, bg-api-tunnel must be added there too (checked at the checkpoint).
Match User bg-api-tunnel
  AuthenticationMethods publickey
  PasswordAuthentication no
  KbdInteractiveAuthentication no
  AllowTcpForwarding local
  PermitOpen 127.0.0.1:5080
  PermitListen none
  AllowAgentForwarding no
  AllowStreamLocalForwarding no
  X11Forwarding no
  PermitTTY no
  PermitTunnel no
  GatewayPorts no
  PermitUserRC no
  ForceCommand /bin/false
  AuthorizedKeysFile /etc/ssh/authorized_keys.d/bg-api-tunnel
