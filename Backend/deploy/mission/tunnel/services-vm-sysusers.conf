# /etc/sysusers.d/bg-api-tunnel-v2.conf (root:root 0644) on the services VM, applied with systemd-sysusers. A10-D3.
# The tunnel's remote account: a fixed uid and gid of 47080, its own private group, no supplementary group, no home, no shell, a
# locked password. 47080 was chosen after checking the host's passwd and group databases, process owners, file owners (Docker
# volumes included), container identities (postgres:17 runs as 999, the accounts API image as 1654), subordinate ranges (100000+)
# and systemd's dynamic users (61184-65519). Never use it for anything else, on the host or in a container image.
g bg-api-tunnel-v2 47080
u bg-api-tunnel-v2 47080:47080 "Blackglass API tunnel (forward-only)" /nonexistent /usr/sbin/nologin
